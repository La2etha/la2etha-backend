[project]
name = "la2etha-backend"
version = "0.1.0"
description = "Lahza backend — API + async CV workers for personalized event photo galleries"
readme = "README.md"
# 3.11 or 3.12 only: the CV stack (insightface, onnxruntime-gpu, dlib) has no
# prebuilt wheels for 3.13 yet, forcing source builds that need a C/C++ toolchain.
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Auth
    "fastapi-users[sqlalchemy,oauth]>=13.0",
    # DB + vectors
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    # Async workers
    "rq>=1.16",
    "redis>=5.0",
    # CV / AI pipeline (P1 core)
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.18",
    "hdbscan>=0.8.38",
    "scikit-learn>=1.5",
    "opencv-python>=4.10",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    # numpy pinned to the 1.x line: insightface/onnxruntime are compiled against
    # the numpy 1.x ABI, so numpy 2.x can raise "compiled against 1.x" at runtime.
    "numpy>=1.26,<2",
    # Settings
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
]
# Eval-only baselines (Phase 5). Chinese Whispers is implemented in numpy
# (eval/metrics_clustering.py), so dlib is NOT required; this extra only adds
# dlib's reference implementation. Needs CMake + a C++ toolchain.
eval = [
    "dlib>=19.24",
]
# Semantic search (F5, SigLIP-2). Heavy + CUDA-specific, so opt-in. Install the
# CUDA build of torch separately per pytorch.org, then `pip install -e .[search]`.
# Without this the app runs with search disabled (the endpoint returns 503).
search = [
    "torch>=2.2",
    "transformers>=4.45",
    "sentencepiece>=0.2",
]
# Privacy-removal export (F6, LaMa local inpainting). Heavy + CUDA-specific like
# search; opt-in. `pip install -e .[export]` (after a CUDA torch). Without it,
# export still serves originals; a removal request returns 503.
export = [
    "torch>=2.2",
    "simple-lama-inpainting>=0.1.2",
]
# Cloudflare R2 storage (STORAGE_BACKEND=r2). Free tier: 10 GB, no egress.
# Google Drive ingestion needs NO extra — it uses stdlib HTTP.
cloud = [
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
