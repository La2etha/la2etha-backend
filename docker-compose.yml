services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: la2etha
      POSTGRES_PASSWORD: la2etha
      POSTGRES_DB: la2etha
    ports:
      # Host port 5433 avoids clashing with a native PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U la2etha"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
